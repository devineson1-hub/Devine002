<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141B2B"/>
      <stop offset="50%" stop-color="#0E131F"/>
      <stop offset="100%" stop-color="#080B11"/>
    </linearGradient>
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="50%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#F97316" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#F97316" stroke-opacity="0.3" stroke-width="4"/>

  <!-- Audio Wave Bars centered -->
  <g transform="translate(106, 156)" filter="url(#shadow)">
    <!-- Bar 1 -->
    <rect x="10" y="70" width="24" height="60" rx="12" fill="url(#accentGlow)"/>
    <!-- Bar 2 -->
    <rect x="50" y="40" width="24" height="120" rx="12" fill="url(#primaryGlow)"/>
    <!-- Bar 3 -->
    <rect x="90" y="10" width="24" height="180" rx="12" fill="url(#primaryGlow)"/>
    <!-- Center Mic / tall bar -->
    <rect x="130" y="0" width="36" height="200" rx="18" fill="url(#accentGlow)"/>
    <!-- Bar 5 -->
    <rect x="182" y="20" width="24" height="160" rx="12" fill="url(#primaryGlow)"/>
    <!-- Bar 6 -->
    <rect x="222" y="50" width="24" height="100" rx="12" fill="url(#primaryGlow)"/>
    <!-- Bar 7 -->
    <rect x="262" y="75" width="24" height="50" rx="12" fill="url(#accentGlow)"/>
  </g>

  <!-- Small sparkles -->
  <circle cx="390" cy="120" r="10" fill="#FDE047" opacity="0.8"/>
  <circle cx="120" cy="380" r="8" fill="#F97316" opacity="0.7"/>
</svg>
